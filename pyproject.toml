[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-insight-pipeline"
version = "0.1.0"
description = "REVEAL — LLM-powered gene function interpretation for rare disease genomics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Gene Annotation Team"}
]
keywords = ["bioinformatics", "gene-interpretation", "llm", "genomics", "gene-function"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Framework
    "pydantic>=2.0.0",
    "pydantic-ai>=1.0.0",
    "pydantic-graph>=1.0.0",

    # OpenAI Integration
    "openai>=1.0.0",

    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",

    # HTTP Requests
    "requests>=2.32.0",
    "httpx>=0.25.0",

    # Bioinformatics
    "biopython>=1.81",

    # Web Interface
    "streamlit>=1.28.0",
    "plotly>=5.18.0",

    # Terminal UI
    "rich>=14.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/brettrj03/gene-annotation"
Repository = "https://github.com/brettrj03/gene-annotation"
Issues = "https://github.com/brettrj03/gene-annotation/issues"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
